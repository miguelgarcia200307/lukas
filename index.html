<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-mark">
      <lukas-orb id="splash-orb" size="120" state="intro"></lukas-orb>
      <div class="lukas-phrase is-hidden"></div>
    </div>
  </div>

  <div id="app">
    <main id="view" aria-live="polite"></main>
    <nav class="tabbar hidden" aria-label="Navegación principal">
      <div class="tabbar-inner">
        <button class="tab" data-tab="inicio" aria-label="Inicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
          <span>Inicio</span>
        </button>
        <button class="tab" data-tab="movimientos" aria-label="Movimientos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r=".6" fill="currentColor"/><circle cx="3.5" cy="12" r=".6" fill="currentColor"/><circle cx="3.5" cy="18" r=".6" fill="currentColor"/></svg>
          <span>Movimientos</span>
        </button>
        <button class="tab tab-voice" data-voice aria-label="Registrar con voz">
          <span class="voice-fab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
          </span>
        </button>
        <button class="tab" data-tab="reportes" aria-label="Reportes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Reportes</span>
        </button>
        <button class="tab" data-tab="mas" aria-label="Más">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
          <span>Más</span>
        </button>
      </div>
    </nav>
  </div>

  <div id="net-pill" class="net-pill" role="status" aria-live="polite">
    <svg class="np-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.3-1.7M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 11 5M12 20h.01"/></svg>
    <span class="pulse-dot" hidden></span>
    <span class="np-text">Sin conexión</span>
  </div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Lukas necesita JavaScript activado.</p></noscript>
