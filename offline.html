<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F7F4">
  <title>Sin conexión · Lukas</title>
  <link rel="icon" type="image/png" href="./assets/icons/favicon-32.png">
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; background: #F7F7F4; color: #141413;
      font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px); gap: 14px; box-sizing: border-box; }
    svg.logo { width: 84px; height: 84px; filter: drop-shadow(0 14px 28px rgba(75,59,245,.3)); animation: f 4s ease-in-out infinite; }
    h1 { font-size: 26px; margin: 12px 0 0; letter-spacing: -0.02em; }
    p { color: #6F6F69; max-width: 300px; margin: 0; line-height: 1.45; }
    button { margin-top: 12px; min-height: 52px; padding: 0 28px; border: 0; border-radius: 16px; background: #141413; color: #fff;
      font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
    button:active { transform: scale(.97); }
    @keyframes f { 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { svg.logo { animation: none; } }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C5DFF"/><stop offset="1" stop-color="#3A2BD9"/></linearGradient></defs>
      <rect width="512" height="512" rx="128" fill="url(#g)"/>
      <path d="M150 128V380H369" fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="233" y1="300" x2="233" y2="252" stroke="#fff" stroke-width="40" stroke-linecap="round"/>
      <line x1="301" y1="300" x2="301" y2="180" stroke="#fff" stroke-width="40" stroke-linecap="round"/>
      <line x1="369" y1="300" x2="369" y2="236" stroke="#fff" stroke-width="40" stroke-linecap="round"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Cuando vuelva, tus lucas te estarán esperando.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
