# Lukas · configuración de Supabase CLI
project_id = "lukas"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://*.github.io"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Solo un usuario: sin registro público
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Todas las funciones validan la autorización en código (JWT del usuario o secreto interno del cron),
# lo que funciona con las llaves nuevas (sb_publishable / sb_secret) y con JWT asimétricos.
[functions.ai-assistant]
verify_jwt = false

[functions.daily-reminders]
verify_jwt = false

[functions.budget-check]
verify_jwt = false

[functions.send-test-push]
verify_jwt = false
